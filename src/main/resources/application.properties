spring.application.name=quiz_app

# Server Config
server.port=8081

# Kafka Producer Config
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka Consumer Config
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=quiz-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Enable debug logging for Kafka
logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka=INFO

#Mail Sender Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Mongo DB Config
spring.data.mongodb.uri=${MONGODB_URL}
spring.data.mongodb.auto-index-creation=true

# env file importing
spring.config.import=optional:file:./.env[.properties]
app.secret.key=${SECRET_KEY}

# Frontend URL to build quiz invite links
app.frontend.quiz-url=http://localhost:5173/quiz

# No of questions for individual subject
app.no-of-questions=5